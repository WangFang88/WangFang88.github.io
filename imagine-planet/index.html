  <style>
    :root {
      color-scheme: light;
      --ink: #231f1b;
      --muted: #746c62;
      --paper: #fffdf8;
      --line: rgba(61, 49, 37, .11);
      --accent: #da4b2e;
      --shadow: 0 24px 70px rgba(102, 70, 38, .15);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #f7efe0; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 6%, rgba(255,255,255,.98), transparent 28rem),
        radial-gradient(circle at 92% 12%, rgba(252,215,206,.7), transparent 31rem),
        linear-gradient(150deg, #fffaf0 0%, #f6f0e2 58%, #e8ecdf 100%);
      overflow-x: hidden;
    }
    main {
      width: min(1080px, calc(100% - 32px));
      min-height: 100svh;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.03fr .97fr;
      align-items: center;
      gap: clamp(32px, 7vw, 92px);
      padding: max(38px, env(safe-area-inset-top)) 0 max(38px, env(safe-area-inset-bottom));
    }
    .copy { position: relative; z-index: 2; }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      font-weight: 780;
      letter-spacing: -.02em;
    }
    .brand img {
      width: 52px;
      height: 52px;
      border-radius: 13px;
      box-shadow: 0 10px 24px rgba(70, 54, 38, .16);
    }
    h1 {
      max-width: 620px;
      margin: 0;
      font-size: clamp(44px, 7vw, 76px);
      line-height: 1.04;
      letter-spacing: -.055em;
    }
    .lead {
      max-width: 560px;
      margin: 24px 0 32px;
      color: var(--muted);
      font-size: clamp(18px, 2.2vw, 22px);
      line-height: 1.7;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .store-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      padding: 0 25px;
      border-radius: 18px;
      color: white;
      background: var(--ink);
      text-decoration: none;
      font-size: 17px;
      font-weight: 750;
      box-shadow: 0 14px 30px rgba(35,31,27,.19);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .store-button:hover { transform: translateY(-2px); box-shadow: 0 18px 36px rgba(35,31,27,.23); }
    .store-button:focus-visible { outline: 3px solid rgba(218,75,46,.35); outline-offset: 4px; }
    .note { color: var(--muted); font-size: 14px; }
    .visual {
      position: relative;
      min-height: 600px;
      display: grid;
      place-items: center;
    }
    .card {
      width: min(420px, 100%);
      aspect-ratio: 4 / 5;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 42px;
      background: rgba(255,253,248,.72);
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .tangram { position: relative; width: 310px; height: 360px; transform: rotate(-2deg); }
    .piece { position: absolute; filter: drop-shadow(0 10px 7px rgba(61,45,28,.15)); }
    .triangle-a { width: 0; height: 0; border-left: 145px solid transparent; border-right: 145px solid transparent; border-bottom: 145px solid #ff8122; top: 0; left: 10px; }
    .triangle-b { width: 0; height: 0; border-top: 170px solid #25cab9; border-right: 170px solid transparent; top: 145px; left: 0; }
    .triangle-c { width: 0; height: 0; border-bottom: 170px solid #5bc1e6; border-left: 170px solid transparent; top: 145px; right: 0; }
    .square { width: 92px; height: 92px; background: #f47f68; transform: rotate(45deg); top: 196px; left: 109px; }
    .small-a { width: 0; height: 0; border-left: 66px solid transparent; border-right: 66px solid transparent; border-bottom: 66px solid #59ddce; top: 294px; left: 12px; }
    .small-b { width: 0; height: 0; border-left: 66px solid transparent; border-right: 66px solid transparent; border-bottom: 66px solid #59ddce; top: 294px; right: 12px; }
    .spark { position: absolute; border-radius: 50%; background: rgba(218,75,46,.18); filter: blur(.2px); }
    .spark.one { width: 120px; height: 120px; right: -36px; top: 52px; }
    .spark.two { width: 72px; height: 72px; left: -16px; bottom: 56px; background: rgba(38,202,185,.18); }
    footer { position: fixed; left: 0; right: 0; bottom: 12px; text-align: center; color: rgba(35,31,27,.45); font-size: 13px; }
    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; text-align: center; gap: 18px; padding-top: 28px; }
      .copy { display: flex; flex-direction: column; align-items: center; }
      .brand { margin-bottom: 20px; }
      .lead { margin: 18px 0 24px; }
      .actions { justify-content: center; }
      .visual { min-height: auto; order: -1; }
      .card { width: min(280px, 78vw); border-radius: 30px; }
      .tangram { transform: scale(.7) rotate(-2deg); }
      footer { position: static; padding: 18px 0 20px; }
    }
    @media (prefers-reduced-motion: reduce) { .store-button { transition: none; } }
  </style>
</head>
<body>
  <main>
    <section class="copy">
      <div class="brand"><img src="https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/5f/af/0b/5faf0b26-ad93-ec74-43f1-d1a4e9a33284/AppIcon-0-0-1x_U007epad-0-1-85-220.png/512x512bb.jpg" alt=""><span data-i18n="name">巧想星球</span></div>
      <h1 data-i18n="title">七块板，<br>无数种想象。</h1>
      <p class="lead" data-i18n="lead">移动、旋转与翻转七巧板，把零散的形状拼回完整轮廓。从简单图形开始，慢慢发现几何中的细节与秩序。</p>
      <div class="actions">
        <a class="store-button" href="https://apps.apple.com/us/app/imagine-planet/id6834207084" rel="noopener" data-i18n="cta">App Store 下载</a>
        <span class="note" data-i18n="note">iPhone 与 iPad 适用</span>
      </div>
    </section>
    <section class="visual" aria-hidden="true">
      <div class="spark one"></div><div class="spark two"></div>
      <div class="card">
        <div class="tangram">
          <span class="piece triangle-a"></span><span class="piece triangle-b"></span><span class="piece triangle-c"></span>
          <span class="piece square"></span><span class="piece small-a"></span><span class="piece small-b"></span>
        </div>
      </div>
    </section>
  </main>
  <footer>© 2026 巧想星球</footer>

  <script>
    const messages = {
      'zh-Hant': { name: '巧想星球', title: '七塊板，<br>無數種想像。', lead: '移動、旋轉與翻轉七巧板，把零散的形狀拼回完整輪廓。從簡單圖形開始，慢慢發現幾何中的細節與秩序。', cta: '前往 App Store', note: '適用於 iPhone 與 iPad' },
      en: { name: 'Tangram Planet', title: 'Seven pieces.<br>Endless ideas.', lead: 'Move, rotate, and flip the tangram pieces to rebuild complete silhouettes. Start with simple shapes and discover the quiet order hidden in geometry.', cta: 'View on the App Store', note: 'Made for iPhone and iPad' },
      ko: { name: '칠교 행성', title: '일곱 조각,<br>무한한 상상.', lead: '칠교 조각을 옮기고 돌리고 뒤집어 하나의 실루엣을 완성해 보세요. 간단한 도형에서 시작해 기하학 속 질서를 발견해 보세요.', cta: 'App Store에서 보기', note: 'iPhone 및 iPad용' },
      ja: { name: 'タングラム惑星', title: '7 つのピース、<br>無限の想像。', lead: 'ピースを動かし、回転・反転させてシルエットを完成させましょう。シンプルな形から始めて、幾何学の秩序を見つけてください。', cta: 'App Store で見る', note: 'iPhone・iPad 対応' }
    };
    const language = navigator.language || 'zh-CN';
    const locale = language.startsWith('zh-TW') || language.startsWith('zh-HK') ? 'zh-Hant' : language.split('-')[0];
    const copy = messages[locale];
    if (copy) {
      document.documentElement.lang = locale;
      for (const [key, value] of Object.entries(copy)) {
        const element = document.querySelector(`[data-i18n="${key}"]`);
        if (element) element.innerHTML = value;
      }
    }
  </script>
</body>
</html>
