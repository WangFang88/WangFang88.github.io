<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>小嘉时钟 · 情侣邀请</title>
  <meta name="description" content="打开小嘉时钟接受情侣邀请，未安装可前往 App Store 下载。" />
  <style>
    :root {
      --bg: #f7f2ea;
      --ink: #2a2218;
      --muted: #6b5e50;
      --accent: #c47a3a;
      --card: #fffdf9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      background:
        radial-gradient(ellipse at top, #fff8ef 0%, transparent 55%),
        linear-gradient(165deg, #f7f2ea 0%, #ebe3d6 100%);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 18px 40px;
    }
    .card {
      width: min(420px, 100%);
      background: var(--card);
      border-radius: 22px;
      padding: 28px 22px 24px;
      box-shadow: 0 18px 48px rgba(60, 40, 20, 0.12);
      border: 1px solid rgba(80, 55, 30, 0.08);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .lead {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.55;
    }
    .code-box {
      text-align: center;
      padding: 16px 12px;
      border-radius: 14px;
      background: rgba(196, 122, 58, 0.08);
      margin-bottom: 18px;
    }
    .code-label {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .code {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.28em;
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
    .code.missing { letter-spacing: 0; font-size: 1rem; font-weight: 600; }
    .actions { display: flex; flex-direction: column; gap: 10px; }
    a.btn, button.btn {
      display: block;
      text-align: center;
      text-decoration: none;
      border: none;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-secondary {
      background: transparent;
      color: var(--accent);
      border: 1.5px solid rgba(196, 122, 58, 0.45);
    }
    .hint {
      margin-top: 16px;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .status {
      margin-top: 12px;
      font-size: 0.8rem;
      color: var(--muted);
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>小嘉情侣时钟邀请</h1>
    <p class="lead" id="lead">正在打开小嘉时钟以接受邀请。若未安装，将前往 App Store。</p>

    <div class="code-box">
      <div class="code-label">邀请码</div>
      <div class="code" id="code">--------</div>
    </div>

    <div class="actions">
      <a class="btn btn-primary" id="openApp" href="#">打开小嘉时钟</a>
      <a class="btn btn-secondary" id="openStore" href="https://apps.apple.com/app/id6776895229">去 App Store 下载</a>
    </div>

    <p class="hint">
      微信内若未能自动跳转：可点上方「打开小嘉时钟」，或用系统 Safari / 相机打开本页。
      也可打开已安装的小嘉时钟 → 情侣时钟 →「我有邀请码」手动输入。
    </p>
    <p class="status" id="status"></p>
  </main>

  <script>
    (function () {
      var APP_STORE = "https://apps.apple.com/app/id6776895229";
      var CUSTOM_SCHEME_BASE = "jiaclock://couple/join";
      var params = new URLSearchParams(window.location.search);
      var code = (params.get("code") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
      var codeEl = document.getElementById("code");
      var openApp = document.getElementById("openApp");
      var openStore = document.getElementById("openStore");
      var statusEl = document.getElementById("status");
      var leadEl = document.getElementById("lead");

      openStore.href = APP_STORE;

      if (code.length === 8) {
        codeEl.textContent = code;
        codeEl.classList.remove("missing");
      } else {
        codeEl.textContent = "链接无效，请让对方重新分享";
        codeEl.classList.add("missing");
        leadEl.textContent = "邀请链接缺少有效邀请码。";
        openApp.style.display = "none";
        return;
      }

      var customURL = CUSTOM_SCHEME_BASE + "?code=" + encodeURIComponent(code);
      // Same HTTPS URL — when opened outside WeChat / via UL, iOS can hand off to the app.
      var httpsURL = window.location.origin + "/couple/join?code=" + encodeURIComponent(code);
      openApp.href = customURL;

      function tryOpenApp() {
        statusEl.textContent = "正在尝试打开 App…";
        // Prefer custom scheme tap target; also poke location for non-WeChat browsers.
        var iframe = document.createElement("iframe");
        iframe.style.display = "none";
        iframe.src = customURL;
        document.body.appendChild(iframe);
        setTimeout(function () {
          try { document.body.removeChild(iframe); } catch (e) {}
        }, 800);
      }

      openApp.addEventListener("click", function (e) {
        // Keep default navigation to custom scheme; also mirror for stubborn WebViews.
        statusEl.textContent = "若未跳转，请改用 Safari 打开本页，或前往 App Store。";
      });

      // Auto attempt once (Camera / Safari often already Universal-Link into the app).
      var ua = navigator.userAgent || "";
      var inWeChat = /MicroMessenger/i.test(ua);
      if (!inWeChat) {
        tryOpenApp();
        setTimeout(function () {
          // If still visible, user likely doesn't have the app.
          if (!document.hidden) {
            statusEl.textContent = "未检测到 App，可下载或手动输入邀请码。";
            window.location.href = APP_STORE;
          }
        }, 1600);
      } else {
        statusEl.textContent = "检测到微信：请点「打开小嘉时钟」，或在 Safari 中打开本链接。";
      }

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          statusEl.textContent = "";
        }
      });
    })();
  </script>
</body>
</html>
